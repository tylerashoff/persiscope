name: Publish

# Pushing a version tag (v0.1.0b1, v0.2.0, ...) builds the package, publishes
# it to TestPyPI, and then — after the `pypi` environment's approval gate, if
# one is configured — publishes the same artifacts to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC): no API tokens are stored anywhere.
# Both indexes need a trusted publisher registered for this repo + workflow.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Run tests against the built wheel
        run: |
          pip install dist/*.whl
          pip install pytest pandas dtaidistance similaritymeasures matplotlib plotly nbformat
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/persiscope
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/persiscope
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
